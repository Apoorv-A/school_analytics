<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password - {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth-shell">
  <section class="auth-panel" style="grid-column: 1 / -1; max-width: 480px; margin: 0 auto;">
    <div class="auth-card">
      <h2>Set new password</h2>

      {% if error %}
        <div class="alert alert--error" style="margin-bottom:18px" role="alert">{{ error }}</div>
      {% endif %}

      {% if valid %}
        <form method="post" action="/reset-password" autocomplete="off">
          <input type="hidden" name="token" value="{{ token }}">
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" required minlength="8"
                   autocomplete="new-password" placeholder="At least 8 characters">
          </div>
          <div class="field">
            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password" required
                   minlength="8" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn--primary btn--block">Update password</button>
        </form>
      {% else %}
        <p>This reset link is invalid or has expired. Request a new one from the sign-in page.</p>
        <p class="muted" style="margin-top:16px;font-size:13px">
          <a href="/forgot-password">Request reset</a> · <a href="/login">Sign in</a>
        </p>
      {% endif %}
    </div>
  </section>
</div>
</body>
</html>
