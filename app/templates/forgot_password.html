<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth-shell">
  <section class="auth-panel" style="grid-column: 1 / -1; max-width: 480px; margin: 0 auto;">
    <div class="auth-card">
      <h2>Reset password</h2>
      <p>Enter your school email and we will send reset instructions if an account exists.</p>

      {% if error %}
        <div class="alert alert--error" style="margin-bottom:18px" role="alert">{{ error }}</div>
      {% endif %}
      {% if message %}
        <div class="alert" style="margin-bottom:18px" role="status">{{ message }}</div>
      {% endif %}

      <form method="post" action="/forgot-password" autocomplete="on">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required autocomplete="username"
                 placeholder="you@school.edu" autofocus>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Request reset</button>
      </form>
      <p class="muted" style="margin-top:16px;font-size:13px">
        <a href="/login">Back to sign in</a>
      </p>
    </div>
  </section>
</div>
</body>
</html>
