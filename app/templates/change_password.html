<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password - {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="auth-shell">
  <section class="auth-panel" style="grid-column: 1 / -1; max-width: 480px; margin: 0 auto;">
    <div class="auth-card">
      <h2>Change password</h2>
      {% if forced %}
        <p>You must set a new password before continuing.</p>
      {% else %}
        <p>Choose a new password for your account.</p>
      {% endif %}

      {% if error %}
        <div class="alert alert--error" style="margin-bottom:18px" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/change-password" autocomplete="off">
        <div class="field">
          <label for="current_password">Current password</label>
          <input id="current_password" name="current_password" type="password" required
                 autocomplete="current-password">
        </div>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" required minlength="8"
                 autocomplete="new-password" placeholder="At least 8 characters">
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" required
                 minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn--primary btn--block">Save password</button>
      </form>
      {% with style="margin-top:12px" %}
        {% include "components/_logout_form.html" %}
      {% endwith %}
    </div>
  </section>
</div>
</body>
</html>
