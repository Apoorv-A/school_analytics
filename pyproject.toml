[project]
name = "school-analytics"
version = "1.0.0"
description = "Multi-portal analytics platform for schools: parents, students, teachers, and leadership"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tools"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "S",      # bandit security checks
    "DTZ",    # naive datetime usage
    "RUF",
]
ignore = [
    "B008",   # FastAPI dependencies are declared as call expressions in defaults
    "RUF012", # test classes group route lists as plain class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert is how pytest works
    "S105",   # test fixtures reference placeholder passwords
    "E501",
]
"seed/*" = [
    "S311",   # the seeder wants reproducible pseudo-random data, not crypto randomness
]
"scripts/*" = ["S101", "T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
