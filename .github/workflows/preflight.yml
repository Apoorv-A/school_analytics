name: preflight

# SQLite suite only. PostgreSQL migrations/RLS run in postgres-integration.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Ruff
        run: pip install ruff && ruff check app seed tests tenant_config tenant_operator scripts

      - name: Tests
        # Requires embedded config/ mirror; run locally with school-analytics-config checkout.
        run: PYTHONPATH=. pytest -q --ignore=tests/test_config_schema.py
        env:
          SECRET_KEY: ci-test-secret

      - name: Generate docs
        run: PYTHONPATH=. python scripts/docs_generate.py

      - name: Docs drift check
        run: git diff --exit-code docs/analytics/chart-catalog.yaml docs/analytics/chart-catalog.md docs/data/column-dictionary.md

      - name: Tenant schema export
        run: PYTHONPATH=. python -m tenant_operator schema --output /tmp/tenant.schema.json

      - name: Helm lint
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - run: |
          helm lint deploy/helm/school-analytics \
            --set-string image.tag=ci
